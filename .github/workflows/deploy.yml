name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Set under Settings > Secrets and variables > Actions > Variables.
    env:
      VITE_IMPRINT_NAME: ${{ vars.IMPRINT_NAME }}
      VITE_IMPRINT_STREET: ${{ vars.IMPRINT_STREET }}
      VITE_IMPRINT_CITY: ${{ vars.IMPRINT_CITY }}
      VITE_IMPRINT_EMAIL: ${{ vars.IMPRINT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A failing test stops the deploy, so the live site keeps the last good build.
      - run: npm test
      # Without this, the build would fall back to the placeholders in .env.
      - name: Check imprint variables
        run: |
          for name in VITE_IMPRINT_NAME VITE_IMPRINT_STREET VITE_IMPRINT_CITY VITE_IMPRINT_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name#VITE_} is not set."
              exit 1
            fi
          done
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
